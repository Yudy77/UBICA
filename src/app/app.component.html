<ion-app>
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content" menuId="principal" [disabled]="!menuHabilitado">
      <ion-header>
        <ion-toolbar>
          <ion-title>UBICA | Menú</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list>
          <ion-menu-toggle [autoHide]="false"><ion-item routerLink="/home">
            <ion-icon name="home-outline" slot="start"></ion-icon>
            <ion-label>Panel principal</ion-label>
          </ion-item></ion-menu-toggle>

          <ion-menu-toggle [autoHide]="false"><ion-item routerLink="/registro">
            <ion-icon name="add-circle-outline" slot="start"></ion-icon>
            <ion-label>Nuevo registro</ion-label>
          </ion-item></ion-menu-toggle>

          <ion-menu-toggle [autoHide]="false"><ion-item button (click)="cerrarSesion()">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label>Cerrar sesión</ion-label>
          </ion-item></ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
