<ion-header>
  <ion-toolbar color="primary">
    <ion-title>UBICA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- PARTE A: Tarjeta ion-card -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Curso de Ionic</ion-card-title>
      <ion-card-subtitle>Nivel Intermedio</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      Aprende a construir aplicaciones móviles
      multiplataforma con Ionic Framework y Angular.
    </ion-card-content>
  </ion-card>

  <!-- PARTE B: Lista interactiva -->
  <ion-list>
    <ion-item-sliding *ngFor="let tarea of tareas">

      <ion-item>
        <ion-label>
          <h2>{{ tarea.titulo }}</h2>
          <p>{{ tarea.descripcion }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="eliminar(tarea.id)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

</ion-content>
