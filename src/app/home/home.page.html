<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>UBICA</ion-title>
    <ion-buttons slot="end">
      <ion-icon name="notifications-outline"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-refresher slot="fixed" (ionRefresh)="refrescar($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <section class="bienvenida">
    <h1>¡Hola!</h1>
    <p>Aquí están tus registros.</p>
  </section>

  <div class="categorias">

    <ion-card>
      <ion-card-content>
        <ion-icon name="cube-outline"></ion-icon>
        <h2>Objetos</h2>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-content>
        <ion-icon name="document-text-outline"></ion-icon>
        <h2>Documentos</h2>
      </ion-card-content>
    </ion-card>

    <ion-card routerLink="/registro">
      <ion-card-content>
        <ion-icon name="add-outline"></ion-icon>
        <h2>Nuevo registro</h2>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-content>
        <ion-icon name="search-outline"></ion-icon>
        <h2>Buscar</h2>
      </ion-card-content>
    </ion-card>

  </div>

  <h2 class="titulo-seccion">Registros recientes</h2>

  <ion-list>
    <ion-item-sliding *ngFor="let registro of registros"
  (pointerdown)="iniciarPulsacion($event, registro)"
  (pointermove)="detectarMovimiento($event)"
  (pointerup)="cancelarPulsacion()"
  (pointercancel)="cancelarPulsacion()"
  (pointerleave)="cancelarPulsacion()">

      <ion-item>
        <ion-icon [name]="registro.icono" slot="start"></ion-icon>
        <ion-label>
          <h2>{{ registro.nombre }}</h2>
          <p>{{ registro.ubicacion }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="eliminar(registro.id)">
          <ion-icon name="trash" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/registro">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

<div class="fondo-contextual" *ngIf="menuContextual"
  (click)="cerrarMenu()">

  <div class="menu-contextual" (click)="$event.stopPropagation()">
    <h2>{{ registroSeleccionado?.nombre }}</h2>

    <p>Ubicación: {{ registroSeleccionado?.ubicacion }}</p>

    <button (click)="eliminar(registroSeleccionado.id); cerrarMenu()">
      Eliminar registro
    </button>

    <button (click)="cerrarMenu()">
      Cancelar
    </button>
  </div>
</div>
</ion-content>
